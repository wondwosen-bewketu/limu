<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a1f19">
  <meta name="description" content="LIMU Coffee — digital menu. Breakfast, burgers, traditional Ethiopian dishes, fresh juice and specialty coffee.">
  <title>LIMU Coffee — Menu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <section class="hero" id="top">
    <div class="hero-bg" style="background-image:url('assets/images/food/hero.jpg')"></div>
    <div class="container">
      <span class="eyebrow">Ethiopian coffee &amp; kitchen</span>
      <h1>Our <em>Menu</em></h1>
      <p class="lead">From a slow morning chechebsa to a sizzling plate of Limu special tibs — and coffee from the highlands it's named after.</p>
      <div class="hero-ctas">
        <a class="btn btn-gold" href="#menu">Explore the menu <span aria-hidden="true">↓</span></a>
        <a class="btn btn-ghost" href="shop.html">Buy our coffee</a>
      </div>
      <div class="hero-stats" id="heroStats"></div>
    </div>
    <span class="scroll-hint" aria-hidden="true"></span>
  </section>

  <section class="section signatures">
    <div class="container">
      <div class="section-head reveal">
        <div>
          <span class="eyebrow">House favourites</span>
          <h2>Signatures</h2>
        </div>
      </div>
      <div class="rail" id="signatureRail"></div>
    </div>
  </section>

  <main id="menu">
    <div class="menu-tools">
      <div class="container">
        <div class="search-row">
          <label class="search" id="searchBox">
            <span class="sr-only">Search the menu</span>
            <span data-icon="search"></span>
            <input id="search" type="search" placeholder="Search tibs, latte, pizza…" autocomplete="off">
            <button class="clear" id="clearSearch" type="button" aria-label="Clear search" data-icon="close" style="width:22px;height:22px"></button>
          </label>
        </div>
        <div class="search-row filter-pills" role="group" aria-label="Filter">
          <button class="pill active" data-filter="all">All</button>
          <button class="pill" data-filter="signature">★ Signature</button>
          <button class="pill" data-filter="fasting">Fasting</button>
          <button class="pill" data-filter="veg">Veg</button>
        </div>
        <nav class="cat-nav" id="catNav" aria-label="Menu categories"></nav>
      </div>
    </div>

    <div class="container" id="menuSections"></div>
    <div class="container">
      <div class="empty" id="empty"><b>Nothing found</b>Try another word or clear the filter.</div>
    </div>
  </main>

  <div id="footer"></div>

  <div class="order-bar" id="orderBar">
    <span class="count" id="barCount">0</span>
    <span class="lbl" id="barTotal">0 ETB<small>My selection</small></span>
    <button class="btn btn-gold" id="viewOrder">View order</button>
  </div>

  <div class="waiter" id="waiter" role="dialog" aria-modal="true" aria-label="Order for the waiter"></div>

  <script src="js/data.js"></script>
  <script src="js/common.js"></script>
  <script src="js/menu.js"></script>
</body>
</html>
